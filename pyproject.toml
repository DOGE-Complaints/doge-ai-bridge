[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doge-ai-bridge"
version = "0.1.0"
description = "DOGEstonia AI Bridge — Responses → Story Intake channel façade"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "psycopg[binary]>=3.1.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "openapi-spec-validator>=0.7.0",
]
postgres = [
  "psycopg[binary]>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "postgres: live PostgreSQL integration (requires DATABASE_URL=postgresql://…)",
]
